site_name: Cyber Fidget Docs
site_url: https://docs.cyberfidget.com/
theme:
  name: material
  palette:
    - scheme: slate
      primary: cyan
      accent: cyan
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - toc.integrate

extra_css:
  - assets/guide.css
  - assets/multi.css

hooks:
  - tools/full-code/full_code.py

extra_javascript:
  - assets/lazy-video.js
  - assets/guide.js
  - assets/multi.js

# Pages built but not listed in the navigation: assembly steps are
# embedded in the assembly guide; the emulator README describes the
# screenshot assets.
not_in_nav: |
  /getting-started/assembly/*/step.md
  /assets/emulator/README.md

nav:
  - Home: index.md
  - Product:
    - Overview: product/overview.md
    - Battery and Power: product/battery-and-power.md
    - Accessories: product/accessories.md
    - Open Source: product/open-source.md
  - Getting started:
    - Overview: getting-started/overview.md
    - Assembly: getting-started/assembly/guide.md
    - Explore what it can do: getting-started/explore.md
    - Build your first app: getting-started/first-app.md
    - Make a game, step by step: getting-started/make-a-game.md
    - "Advanced: firmware with Arduino": getting-started/first-flash-arduino.md
  - Make apps:
    - Overview: concepts/index.md
    - Function reference: reference/functions.md
    - How an App Works: concepts/app-lifecycle.md
    - The Update Loop: concepts/update-loop.md
    - Buttons & Events: concepts/buttons.md
    - Drawing to the Screen: concepts/display.md
    - Sprites & Animation: concepts/sprites.md
    - 3D Models: concepts/3d-models.md
    - Sound & Music: concepts/audio.md
    - LEDs & Color: concepts/leds.md
    - The Slider: concepts/slider.md
    - Motion Sensing: concepts/accelerometer.md
    - Tools:
      - App Builder: software/ota-builder.md
      - Code generator: software/code-generator.md
      - "Generator: free use, credits and privacy": software/credits.md
      - Browser Emulator: software/emulator.md
  - Your Fidget:
    - Built-in apps and features:
      - Built-in apps: software/apps.md
      - Voice Notes: firmware/voice-recorder.md
      - Phone Companion: firmware/companion.md
      - Web Portal: firmware/web-portal.md
      - Awake & dev mode: software/awake-and-dev-mode.md
      - Storage & SD: software/storage.md
    - Keep and share your work:
      - Keeping and sharing your work: software/import-export.md
      - Sharing from The Archives: software/sharing-apps.md
    - Update your Fidget:
      - Updates: software/updates.md
      - Update or reset your Fidget: software/updating.md
    - Account and access:
      - Link your Fidget: software/link-your-fidget.md
      - Your Fidgets: software/your-fidgets.md
      - Battery data: software/battery-data.md
      - Beta Access: software/beta-access.md
  - Hardware:
    - Specs: hardware/specs.md
    - Pinout: hardware/pinout.md
    - Hardware specifications: reference/hardware-specs.md
  - Studio:
    - Overview: studio/overview.md
    - Drawing and Version History: studio/drawing-and-versions.md
    - Your Sprite Library: studio/your-sprite-library.md
    - Tools: studio/tools.md
    - Tool Options: studio/tool-options.md
    - Edit Commands: studio/edit-commands.md
    - View: studio/view.md
    - Layers: studio/layers.md
    - Animations and Frames: studio/animations-and-frames.md
    - Animation Names: studio/animation-states.md
    - Preview and Speed: studio/preview.md
    - Files and Versions: studio/files-and-versions.md
    - Sharing: studio/sharing.md
    - 3D Models: studio/3d-models.md
  - Reference:
    - Glossary: reference/glossary.md
    - Serial commands: reference/serial-commands.md
    - Set up WiFi over USB: reference/usb-wifi-setup.md
  - Contributors:
    - Contribute: contribute/contribute.md
    - Firmware internals:
      - Firmware development: firmware/index.md
      - Music Player architecture: firmware/music-player.md
      - LED Effects & Visualizer: firmware/led-effects.md
      - BT A2DP Guide: firmware/bt-a2dp-guide.md
      - IRAM Optimization: firmware/IRAM-overflow-solution.md
      - Deep-sleep current investigation: firmware/deep-sleep-current-investigation.md
    - Releases and updates:
      - Release process: reference/release-process.md
      - Firmware update manifest: reference/firmware-update-manifest.md
      - Firmware version: reference/firmware-version.md
    - Emulator Dev Guide: contribute/emulator-dev.md
    - Guides:
      - Guide Studio: studio/index.html
      - How to Make Guides: contribute/Cyber-Fidget-Guide-Studio.md
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - abbr
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.snippets:
      base_path: [!relative $config_dir]
      check_paths: true
      auto_append:
        - includes/abbreviations.md
  - toc:
      permalink: true

watch:
  - includes

extra:
  social:
    - icon: fontawesome/brands/instagram
      link: https://www.instagram.com/thesamsteele
  analytics:
    provider: google
    property: G-KWMLRGR9E0
