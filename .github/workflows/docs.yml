name: Build & Deploy Docs (Pages)

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'tools/**'
      - 'includes/**'
      - 'mkdocs.yml'
      - 'requirements.txt'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build site
        run: mkdocs build --strict --clean

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  # Checks the function reference against the latest firmware release. It runs
  # beside the build and does not hold up the deploy.
  function-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Get the latest firmware release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/CyberFidget/cyberfidget-firmware/releases/latest --jq .tag_name)
          echo "Checking the function reference against firmware $tag"
          git clone --quiet --depth 1 --branch "$tag" https://github.com/CyberFidget/cyberfidget-firmware.git "$RUNNER_TEMP/cyberfidget-firmware"

      - name: Check the function reference
        run: python tools/function-reference/generate.py --check --firmware "$RUNNER_TEMP/cyberfidget-firmware"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
